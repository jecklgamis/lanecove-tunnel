name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate commit summary
        id: commits
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          else
            RANGE="${{ github.ref_name }}"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV
          {
            echo 'NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes since ${{ env.PREV_TAG }}

            ${{ env.NOTES }}

  build-deb:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Compile inside a pinned Ubuntu 22.04 container rather than directly
      # on the runner. The runner's own OS (ubuntu-latest) moves out from
      # under us over time (it silently became 24.04, whose newer glibc
      # produced binaries that fail to load — "GLIBC_2.38 not found" — on
      # any older target, e.g. the 22.04 boxes this is meant to run on).
      # Building against a fixed, older glibc baseline keeps the binary
      # forward-compatible with newer systems without relying on whatever
      # Ubuntu version GitHub happens to alias "latest" to this month.
      - name: Build deb (pinned Ubuntu 22.04 toolchain for glibc compatibility)
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 bash -c "
            set -e
            apt-get update -q
            apt-get install -y -q build-essential libssl-dev libyaml-dev
            make deb DEB_ARCH=${{ matrix.arch }} DEB_VERSION=$VERSION
            chown -R $(id -u):$(id -g) build
          "

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb

  build-rpm:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Same glibc-pinning rationale as build-deb above, using a common
      # older RPM-family baseline (RHEL/Rocky/Alma 8, glibc 2.28) instead
      # of whatever glibc the ubuntu-latest runner happens to ship.
      - name: Build rpm (pinned Rocky Linux 8 toolchain for glibc compatibility)
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          RPM_VER="${VERSION%%-*}"
          RPM_REL="${VERSION#*-}"
          if [ "$RPM_REL" = "$VERSION" ]; then RPM_REL="1"; fi
          docker run --rm -v "$PWD:/src" -w /src rockylinux:8 bash -c "
            set -e
            dnf install -y -q dnf-plugins-core
            dnf config-manager --set-enabled powertools
            dnf install -y -q gcc make openssl-devel libyaml-devel rpm-build
            make rpm RPM_VERSION=$RPM_VER RPM_RELEASE=$RPM_REL
            chown -R $(id -u):$(id -g) build
          "

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/rpm/RPMS/**/*.rpm
