# DEMO CONFIG — uses keys/pre_shared_key committed in this repo for local testing only.
# Regenerate before using on any non-local network: ./scripts/lanecove-generate-peer-keys.sh
interface: lanecove0
port: 5040
private_key_file: /etc/lanecove/peer-1.key
pre_shared_key: some-psk
verbose: false

peers:
  - public_key: b2d96646e3461951bac8c557d96a56d502c05bc1b6fb5535635004a60a5db23f
    endpoint: some-relay-host:5040 # must point to the host machine where relay is running
    allowed_ips:
      - 10.9.0.0/24
